[project]
name = "wiredex"
# Read from src/wiredex/__init__.py, which release-please bumps. Being dynamic also
# keeps the version out of uv.lock, so a release never makes the lockfile stale.
dynamic = ["version"]
description = "Wiredex API: parts, projects, wiring and firmware for a personal hardware lab."
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.103",
    "click>=8.5",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
wiredex = "wiredex.bootstrap.cli:cli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[minio,postgres]>=4.15.0",
    "types-boto3[s3]>=1.43.103",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wiredex/__init__.py"

# --- Lint & format ------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "C90",      # mccabe complexity
  "SIM",      # simplify
  "RET",      # return statements
  "PTH",      # pathlib over os.path
  "PL",       # pylint
  "PT",       # pytest style
  "S",        # bandit security
  "T20",      # no print
  "ERA",      # no commented-out code
  "ARG",      # unused arguments
  "RUF",      # ruff-specific
]

[tool.ruff.lint.mccabe]
# Small methods, few branches: object calisthenics in practice.
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S107"]  # asserts, literals, test passwords

# --- Types --------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
# Tests are type-checked too. Test folders have no __init__.py, so each file is
# named by its path relative to src/ or tests/ (e.g. integration.conftest).
mypy_path = ["src", "tests"]
files = ["src", "tests"]
explicit_package_bases = true
strict = true
warn_unreachable = true

# --- Tests --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers live in tests/support and import as `support.*`.
pythonpath = ["tests"]
# Integration tests need Docker; `make test-integration` runs them.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not integration"]
markers = ["integration: needs a real PostgreSQL"]
# SQLAlchemy warnings point at real bugs (e.g. a type skipping the statement cache).
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
branch = true
# A path, not the package name: Alembic loads migrations/env.py under its own module
# name, which package-based source matching doesn't count.
source = ["src/wiredex"]

[tool.coverage.report]
# A floor against backsliding, over unit and integration tests together (make coverage).
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']
skip_covered = true

# --- Architecture (ADR 0001) --------------------------------------------------

[tool.importlinter]
root_packages = ["wiredex"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain code is plain Python: no web, validation or database frameworks"
type = "forbidden"
source_modules = ["wiredex.*.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Inside a module, dependencies point inward: api/infrastructure -> application -> domain"
type = "layers"
containers = ["wiredex.system", "wiredex.shared_kernel", "wiredex.identity", "wiredex.catalog", "wiredex.files"]
layers = ["(api) | (infrastructure)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
name = "Only the composition root may import bootstrap"
type = "forbidden"
source_modules = ["wiredex.system", "wiredex.shared_kernel", "wiredex.identity", "wiredex.catalog", "wiredex.files"]
forbidden_modules = ["wiredex.bootstrap"]

[[tool.importlinter.contracts]]
name = "Modules don't import each other: bootstrap passes what one needs from another"
type = "independence"
modules = ["wiredex.system", "wiredex.identity", "wiredex.catalog", "wiredex.files"]
