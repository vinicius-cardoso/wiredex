[project]
name = "wiredex"
version = "0.0.0"
description = "Wiredex API: parts, projects, wiring and firmware for a personal hardware lab."
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# --- Lint & format ------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "C90",      # mccabe complexity
  "SIM",      # simplify
  "RET",      # return statements
  "PTH",      # pathlib over os.path
  "PL",       # pylint
  "PT",       # pytest style
  "S",        # bandit security
  "T20",      # no print
  "ERA",      # no commented-out code
  "ARG",      # unused arguments
  "RUF",      # ruff-specific
]

[tool.ruff.lint.mccabe]
# Small methods, few branches: object calisthenics in practice.
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

# --- Types --------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["wiredex"]
strict = true
warn_unreachable = true

# --- Tests --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["integration: needs a real PostgreSQL"]

[tool.coverage.run]
branch = true
source = ["wiredex"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- Architecture (ADR 0001) --------------------------------------------------

[tool.importlinter]
root_packages = ["wiredex"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain code is plain Python: no web, validation or database frameworks"
type = "forbidden"
source_modules = ["wiredex.*.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Inside a module, dependencies point inward: api/infrastructure -> application -> domain"
type = "layers"
containers = ["wiredex.system"]
layers = ["(api) | (infrastructure)", "(application)", "domain"]

[[tool.importlinter.contracts]]
name = "Only the composition root may import bootstrap"
type = "forbidden"
source_modules = ["wiredex.system"]
forbidden_modules = ["wiredex.bootstrap"]
