[project]
name = "wiredex"
version = "0.0.0"
description = "Wiredex API: parts, projects, wiring and firmware for a personal hardware lab."
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# --- Lint & format ------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "C90",      # mccabe complexity
  "SIM",      # simplify
  "RET",      # return statements
  "PTH",      # pathlib over os.path
  "PL",       # pylint
  "PT",       # pytest style
  "S",        # bandit security
  "T20",      # no print
  "ERA",      # no commented-out code
  "ARG",      # unused arguments
  "TC",       # type-checking imports
  "RUF",      # ruff-specific
]

[tool.ruff.lint.mccabe]
# Small methods, few branches: object calisthenics in practice.
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

# --- Types --------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["wiredex"]
strict = true
warn_unreachable = true

# --- Tests --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: needs a real PostgreSQL"]

[tool.coverage.run]
branch = true
source = ["wiredex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
