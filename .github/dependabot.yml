# Weekly dependency updates, one grouped PR per ecosystem. Each PR goes through
# the same CI gates as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    # Let fresh releases settle for a few days, like pnpm's minimumReleaseAge.
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # @types/node must match the Node runtime major (.nvmrc, 24 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # packages/api-client stays on TypeScript 5: openapi-typescript needs its
      # compiler API, which the native TypeScript 7 does not expose. Majors are
      # upgraded by hand, per package.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      javascript:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
