name: Release

# On every push to main, release-please updates one open release PR with the next
# version (from Conventional Commits) and the changelog. Merging that PR tags
# vX.Y.Z, publishes the GitHub Release, and deploys that version (ADR 0009, 0012).
#
# "Run workflow" (workflow_dispatch) builds and deploys any ref by hand: a redeploy,
# a rollback to an older tag, or a pre-release check of main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and deploy, e.g. main or v0.1.0"
        required: true
        default: main

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A fine-grained personal access token, not GITHUB_TOKEN: pull requests
          # opened with GITHUB_TOKEN don't start workflows, so the release PR would
          # never get the required CI checks.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build and scan the API image and the web app
    needs: release-please
    # `always()` lets this run when release-please was skipped (manual runs).
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && needs.release-please.outputs.tag_name || inputs.ref }}

      - name: Name this build
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          # Release tags deploy as themselves; anything else as sha-<short>.
          tag=$(git describe --tags --exact-match 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || echo "sha-${commit:0:7}")
          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "built_at=$(date -u +%FT%TZ)"
          } >>"$GITHUB_OUTPUT"
          echo "Building $tag ($commit)" >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for known vulnerabilities (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.74.0 image --quiet --exit-code 1
          --severity HIGH,CRITICAL --ignore-unfixed
          ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.tag }}

      - name: Push the image
        run: docker push ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.tag }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        env:
          WIREDEX_GIT_COMMIT: ${{ steps.meta.outputs.commit }}
        run: pnpm --filter @wiredex/web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    name: Deploy to wiredex.vinilabs.cc
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://wiredex.vinilabs.cc
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # printf '%s\n': OpenSSH rejects a key without its trailing newline.
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust whatever answers on first connect.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts

      - name: Upload the web build and deploy files
        run: |
          rsync -az --delete web-dist/ "$TARGET:/srv/wiredex/web/releases/$TAG/"
          rsync -az deploy/compose.prod.yml "$TARGET:/srv/wiredex/compose.yml"
          rsync -az deploy/wiredex.caddy "$TARGET:/srv/wiredex/caddy/wiredex.caddy"
          rsync -az deploy/deploy.sh "$TARGET:/srv/wiredex/bin/deploy.sh"

      - name: Deploy (rolls back by itself if the API never gets ready)
        run: |
          # shellcheck disable=SC2029 # $TAG is meant to expand here, on the runner
          ssh "$TARGET" /srv/wiredex/bin/deploy.sh "$TAG"

      - name: Smoke test through the public URL
        run: |
          # The first deploy waits for Caddy to get the certificate.
          for _ in $(seq 1 30); do
            if live=$(curl --silent --fail --max-time 5 https://wiredex.vinilabs.cc/api/version); then break; fi
            sleep 5
          done
          echo "live: $live"
          test "$(jq -r .commit <<<"$live")" = "$COMMIT" || { echo "::error::/api/version is not serving $COMMIT"; exit 1; }
          curl --silent --fail --max-time 5 https://wiredex.vinilabs.cc/api/health/ready | jq -e '.status == "ready"'
          curl --silent --fail --max-time 5 https://wiredex.vinilabs.cc/ | grep -q '/theme-init.js'
          echo "Deployed $TAG ($COMMIT) to https://wiredex.vinilabs.cc" >>"$GITHUB_STEP_SUMMARY"
