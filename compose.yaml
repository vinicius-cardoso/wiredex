# Local development services.
# The API and web app run on the host (make api / make web) for fast reloads;
# only stateful services live here. Values come from .env (see .env.example).
name: wiredex

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wiredex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiredex}
      POSTGRES_DB: ${POSTGRES_DB:-wiredex}
    ports:
      # Loopback only: the database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
