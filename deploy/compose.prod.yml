# Production services on the OCI host (ADR 0009). Lives at /srv/wiredex/compose.yml.
# deploy.sh sets WIREDEX_TAG; secrets come from /srv/wiredex/.env, which never
# leaves the server (see deploy/README.md).
name: wiredex

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env
    # Sized for a host with under 1 GB of RAM shared with other services.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=256MB
      - -c
      - jit=off
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ghcr.io/vinicius-cardoso/wiredex-api:${WIREDEX_TAG:?set WIREDEX_TAG to the image tag to run}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: Caddy on the host is the one way in.
      - "127.0.0.1:8100:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *logging

volumes:
  db-data:
