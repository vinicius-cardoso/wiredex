# Production services on the OCI host (ADR 0009). Lives at /srv/wiredex/compose.yml.
# deploy.sh sets WIREDEX_TAG. Secrets never leave the server (see deploy/README.md):
#   .env      Postgres and the schema owner's login: the db and migrate services only
#   api.env   the API's own login, as wiredex_app (ADR 0007)
name: wiredex

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env
    # Sized for a host with under 1 GB of RAM shared with other services.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=256MB
      - -c
      - jit=off
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: &api-image ghcr.io/vinicius-cardoso/wiredex-api:${WIREDEX_TAG:?set WIREDEX_TAG to the image tag to run}
    restart: unless-stopped
    env_file: api.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: Caddy on the host is the one way in.
      - "127.0.0.1:8100:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *logging

  # One-off, run by deploy.sh: `docker compose run --rm migrate`. The only container
  # that sees the schema owner's password.
  migrate:
    image: *api-image
    profiles: [tools]
    env_file: [.env, api.env]
    command: [wiredex, db, upgrade]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  db-data:
